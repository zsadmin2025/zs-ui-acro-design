<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <div id="app">
      <style>
        .app-loading {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #f5f7fa;
        }
        /* 三柱脉冲动画 */
        .app-loading-bar {
          position: relative;
          width: 14px;
          height: 32px;
          background: #165dff;
          border-radius: 2px;
          animation: app-loading-bar 0.8s infinite ease-in-out;
          animation-delay: 0.16s;
        }
        .app-loading-bar::before,
        .app-loading-bar::after {
          content: '';
          position: absolute;
          top: 0;
          width: 14px;
          height: 32px;
          background: #165dff;
          border-radius: 2px;
          animation: app-loading-bar 0.8s infinite ease-in-out;
        }
        .app-loading-bar::before {
          left: -20px;
          animation-delay: 0s;
        }
        .app-loading-bar::after {
          left: 20px;
          animation-delay: 0.32s;
        }
        .app-loading-text {
          margin-top: 24px;
          color: #86909c;
          font-size: 14px;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          letter-spacing: 0.5px;
        }
        @keyframes app-loading-bar {
          0%, 80%, 100% {
            opacity: 0.6;
            transform: scaleY(1);
          }
          40% {
            opacity: 1;
            transform: scaleY(1.25);
          }
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-bar"></div>
        <div class="app-loading-text">加载中...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
